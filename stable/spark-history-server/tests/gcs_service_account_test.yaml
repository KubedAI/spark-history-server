suite: "GCS service account"
templates: [templates/serviceaccount.yaml]

tests:
  - it: "adds GKE workload identity annotation for GCS"
    set:
      image:
        tag: not-used
      serviceAccount:
        create: true
      logStore:
        type: gcs
        gcs:
          bucket: my-bucket
          eventLogsPath: spark-events/
          gcpServiceAccount: spark-history@my-project.iam.gserviceaccount.com
    asserts:
      - equal:
          path: metadata.annotations
          value:
            "iam.gke.io/gcp-service-account": spark-history@my-project.iam.gserviceaccount.com
